<!DOCTYPE html>
<html>
<head>
    <title>Who Am I?</title>

    <style>
        body {
            background-color: #202020;
            margin: 0;
            font-family: Georgia, serif;
        }

        .container {
            background-color: white;
            width: 80%;
            min-height: 405px;
            margin: 60px auto;
            padding: 40px 30px;
            text-align: center;
        }

        h1 {
            font-family: "Bodoni MT", Didot, Georgia, serif;
            font-size: 56px;
            font-weight: normal;
            margin: 10px 0 0;
            color: black;
        }

        p {
            font-family: Georgia, serif;
            font-size: 16px;
            margin: 0 0 8px;
            color: black;
        }

       #artwork {
    width: 240px;
    height: 190px;
    object-fit: contain;
    display: block;
    margin: 0 auto;
}

        #artworkName {
            font-family: Georgia, serif;
            font-size: 18px;
            font-weight: normal;
            margin-top: 12px;
            min-height: 22px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 90px;
            margin-top: 40px;
        }

        button {
            background-color: #d9d9d9;
            border: none;
            padding: 7px 12px;
            width: 150px;
            font-family: "Bodoni MT", Didot, Georgia, serif;
            font-size: 14px;
            color: black;
            cursor: pointer;
        }

        button:hover {
            background-color: #bdbdbd;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>WHO AM I?</h1>

        <p>Guess the famous artwork.</p>

        <img id="artwork" src="" alt="Famous artwork">

        <h2 id="artworkName"></h2>

        <div class="buttons">
            <button onclick="generateArtwork()">GENERATE ARTWORK</button>

            <button onclick="revealName()">REVEAL NAME</button>
        </div>

    </div>

    <script>
        // List of famous artworks
        const artworks = [
            {
                name: "The Starry Night",
                artist: "Vincent van Gogh",
                image: "https://upload.wikimedia.org/wikipedia/commons/e/ea/Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg"
            },
            {
                name: "The Mona Lisa",
                artist: "Leonardo da Vinci",
                image: "https://upload.wikimedia.org/wikipedia/commons/6/6a/Mona_Lisa.jpg"
            },
            {
                name: "The Great Wave off Kanagawa",
                artist: "Katsushika Hokusai",
                image: "https://upload.wikimedia.org/wikipedia/commons/0/0a/The_Great_Wave_off_Kanagawa.jpg"
            },
            {
                name: "Girl with a Pearl Earring",
                artist: "Johannes Vermeer",
                image: "https://upload.wikimedia.org/wikipedia/commons/d/d7/Meisje_met_de_parel.jpg"
            },
            {
                name: "The Scream",
                artist: "Edvard Munch",
                image: "https://upload.wikimedia.org/wikipedia/commons/f/f4/The_Scream.jpg"
            },
            {
                name: "The Persistence of Memory",
                artist: "Salvador Dalí",
                image: "https://upload.wikimedia.org/wikipedia/en/d/dd/The_Persistence_of_Memory.jpg"
            },
            {
                name: "The Birth of Venus",
                artist: "Sandro Botticelli",
                image: "https://upload.wikimedia.org/wikipedia/commons/0/0b/Sandro_Botticelli_-_La_nascita_di_Venere_-_Google_Art_Project_-_edited.jpg"
            },
            {
                name: "American Gothic",
                artist: "Grant Wood",
                image: "https://upload.wikimedia.org/wikipedia/commons/7/71/Grant_DeVolson_Wood_-_American_Gothic.jpg"
            },
            {
                name: "A Sunday Afternoon on the Island of La Grande Jatte",
                artist: "Georges Seurat",
                image: "https://upload.wikimedia.org/wikipedia/commons/7/7d/A_Sunday_on_La_Grande_Jatte%2C_Georges_Seurat%2C_1884.jpg"
            },
            {
                name: "The Kiss",
                artist: "Gustav Klimt",
                image: "https://upload.wikimedia.org/wikipedia/commons/4/40/The_Kiss_-_Gustav_Klimt_-_Google_Cultural_Institute.jpg"
            },
            {
                name: "Guernica",
                artist: "Pablo Picasso",
                image: "https://upload.wikimedia.org/wikipedia/en/7/74/PicassoGuernica.jpg"
            },
            {
                name: "The Last Supper",
                artist: "Leonardo da Vinci",
                image: "https://upload.wikimedia.org/wikipedia/commons/4/48/The_Last_Supper_-_Leonardo_Da_Vinci_-_High_Resolution_32x16.jpg"
            },
            {
                name: "The Creation of Adam",
                artist: "Michelangelo",
                image: "https://upload.wikimedia.org/wikipedia/commons/5/5b/Michelangelo_-_Creation_of_Adam_%28cropped%29.jpg"
            },
            {
                name: "Nighthawks",
                artist: "Edward Hopper",
                image: "https://upload.wikimedia.org/wikipedia/commons/a/a8/Nighthawks_by_Edward_Hopper_1942.jpg"
            }
        ];

        let previousArtwork = -1;
        let selectedArtwork;

        function generateArtwork() {
            let randomNumber;

            // Pick an artwork different from the previous one
            do {
                randomNumber = Math.floor(Math.random() * artworks.length);
            } while (randomNumber === previousArtwork);

            previousArtwork = randomNumber;
            selectedArtwork = artworks[randomNumber];

            // Display the artwork
            document.getElementById("artwork").src =
                selectedArtwork.image;

            // Hide the answer until Reveal Name is clicked
            document.getElementById("artworkName").textContent = "";
        }

        function revealName() {
            if (selectedArtwork) {
                document.getElementById("artworkName").textContent =
                    selectedArtwork.name + " — " +
                    selectedArtwork.artist;
            }
        }

        // Show an artwork when the page opens
        generateArtwork();
    </script>

</body>
</html>
