<!DOCTYPE html>
<html>
<head>
    <title>Who Am I?</title>
</head>

<body>

    <h1>WHO AM I?</h1>

    <p>Guess the famous artwork.</p>

    <img id="artwork" src="" alt="Famous artwork" width="400">

    <h2 id="artworkName"></h2>

    <button onclick="generateArtwork()">Generate Artwork</button>

    <button onclick="revealName()">Reveal Name</button>

    <script>
        // List of famous artworks
        const artworks = [
            {
                name: "The Starry Night",
                artist: "Vincent van Gogh",
                image: "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ea/Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg/1280px-Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg?utm_source=en.wikipedia.org&utm_campaign=index&utm_content=thumbnail"
            },
            {
                name: "The Mona Lisa",
                artist: "Leonardo da Vinci",
                image: "https://upload.wikimedia.org/wikipedia/commons/6/6a/Mona_Lisa.jpg"
            },
            {
                name: "The Great Wave off Kanagawa",
                artist: "Katsushika Hokusai",
                image: "https://upload.wikimedia.org/wikipedia/commons/0/0a/The_Great_Wave_off_Kanagawa.jpg"
            },
            {
                name: "Girl with a Pearl Earring",
                artist: "Johannes Vermeer",
                image: "https://upload.wikimedia.org/wikipedia/commons/d/d7/Meisje_met_de_parel.jpg"
            },
            {
                name: "The Scream",
                artist: "Edvard Munch",
                image: "https://upload.wikimedia.org/wikipedia/commons/f/f4/The_Scream.jpg"
            },
            {
                name: "The Persistence of Memory",
                artist: "Salvador Dalí",
                image: "https://upload.wikimedia.org/wikipedia/en/d/dd/The_Persistence_of_Memory.jpg"
            },
            {
                name: "The Birth of Venus",
                artist: "Sandro Botticelli",
                image: "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0b/Sandro_Botticelli_-_La_nascita_di_Venere_-_Google_Art_Project_-_edited.jpg/1280px-Sandro_Botticelli_-_La_nascita_di_Venere_-_Google_Art_Project_-_edited.jpg?utm_source=en.wikipedia.org&utm_campaign=index&utm_content=thumbnail"
            },
            {
                name: "American Gothic",
                artist: "Grant Wood",
                image: "https://upload.wikimedia.org/wikipedia/commons/7/71/Grant_DeVolson_Wood_-_American_Gothic.jpg"
            },
            {
                name: "A Sunday Afternoon on the Island of La Grande Jatte",
                artist: "Georges Seurat",
                image: "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7d/A_Sunday_on_La_Grande_Jatte%2C_Georges_Seurat%2C_1884.jpg/500px-A_Sunday_on_La_Grande_Jatte%2C_Georges_Seurat%2C_1884.jpg?utm_source=en.wikipedia.org&utm_campaign=parser&utm_content=thumbnail"
            },
            {
                name: "The Kiss",
                artist: "Gustav Klimt",
                image: "https://upload.wikimedia.org/wikipedia/commons/4/40/The_Kiss_-_Gustav_Klimt_-_Google_Cultural_Institute.jpg"
            },
            {
                name: "Guernica",
                artist: "Pablo Picasso",
                image: "https://upload.wikimedia.org/wikipedia/en/7/74/PicassoGuernica.jpg?utm_source=en.wikipedia.org&utm_campaign=index&utm_content=original"
            },
            {
                name: "The Last Supper",
                artist: "Leonardo da Vinci",
                image: "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/48/The_Last_Supper_-_Leonardo_Da_Vinci_-_High_Resolution_32x16.jpg/960px-The_Last_Supper_-_Leonardo_Da_Vinci_-_High_Resolution_32x16.jpg?utm_source=en.wikipedia.org&utm_campaign=parser&utm_content=thumbnail"
            },
            {
                name: "The Creation of Adam",
                artist: "Michelangelo",
                image: "https://upload.wikimedia.org/wikipedia/commons/5/5b/Michelangelo_-_Creation_of_Adam_%28cropped%29.jpg?utm_source=en.wikipedia.org&utm_campaign=index&utm_content=original"
            },
            {
                name: "Nighthawks",
                artist: "Edward Hopper",
                image: "https://upload.wikimedia.org/wikipedia/commons/a/a8/Nighthawks_by_Edward_Hopper_1942.jpg?utm_source=en.wikipedia.org&utm_campaign=index&utm_content=original"
            }
        ];

        let previousArtwork = -1;
        let selectedArtwork;

        function generateArtwork() {

            let randomNumber;

            // Choose a random artwork
            // without repeating the previous one
            do {
                randomNumber = Math.floor(Math.random() * artworks.length);
            } while (randomNumber === previousArtwork);

            previousArtwork = randomNumber;

            // Select the artwork
            selectedArtwork = artworks[randomNumber];

            // Display the image
            document.getElementById("artwork").src =
                selectedArtwork.image;

            // Hide the name until the user reveals it
            document.getElementById("artworkName").textContent = "";
        }

        function revealName() {

            // Reveal the artwork name and artist
            document.getElementById("artworkName").textContent =
                selectedArtwork.name + " — " + selectedArtwork.artist;

        }

        // Generate an artwork when the page opens
        generateArtwork();

    </script>

</body>
</html>
